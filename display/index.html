TABB Display POC
Version: v12
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TABB · Mannschaftsspiele</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <header class="topbar">
    <div>
      <div class="eyebrow">Tennisabteilung · SV Böblingen</div>
      <img class="tabb-logo" src="tabb-logo.png" alt="TABB – Tennisabteilung der SV Böblingen">
    </div>
    <div class="clock">
      <strong id="clock">--:--</strong>
      <span id="currentDate">--</span>
    </div>
  </header>

  <section class="sponsor-band">
    <div class="sponsor-label">Unsere Partner</div>
    <div class="marquee"><div id="marqueeTrack" class="marquee-track"></div></div>
  </section>

  <main>
    <section class="match-heading">
      <h1>Mannschaftsspiele</h1>
      <div id="displayDate" class="date"></div>
    </section>

    <div class="intro-strip">
      <div>
        <strong>Herzlich willkommen auf unserer Anlage.</strong>
        <span>Hier sehen Sie die heutigen Mannschaftsbegegnungen und Platzbelegungen.</span>
      </div>
      <div id="pageIndicator" class="page-indicator"></div>
    </div>

    <div id="courtPages" class="court-pages"></div>

    <section id="sponsorFill" class="sponsor-fill hidden">
      <h2>Heute keine Begegnungen</h2>
      <p>Für dieses Datum sind noch keine Spiele eingetragen.</p>
      <div id="sponsorWall" class="sponsor-wall"></div>
    </section>
  </main>
</div>
<script src="spielplan.js"></script>
<script src="app.js"></script>
</body>
</html>
